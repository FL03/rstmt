[package]
build = "build.rs"
description = "Various traits used to establish the foundation of the rstmt framework"
name = "rstmt-traits"

authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = false
features = ["full"]
rustc-args = ["--cfg", "docsrs"]
version = "v{{version}}"

[package.metadata.release]
no-dev-version = true
tag-name = "v{{version}}"

[lib]
bench = false
crate-type = ["lib"]
doc = true
doctest = true
test = true

[dependencies]
# custom
rspace-traits = { workspace = true }
# data structures
hashbrown = { optional = true, workspace = true }
# mathematics
num-complex = { optional = true, workspace = true }
num-traits = { workspace = true }
# serialization
serde = { optional = true, workspace = true }
# WebAssembly
wasm-bindgen = { optional = true, workspace = true }
# macros & utilities
paste = { workspace = true }

[features]
default = ["std"]

full = [
  "default",
  "complex",
  "hashbrown",
  "rand",
  "serde",
]

nightly = [
  "hashbrown?/nightly",
  "rspace-traits/nightly",
]

# ************* [FF:Environments] *************
std = [
  "alloc",
  "hashbrown?/default",
  "rspace-traits/std",
  "num-complex?/std",
  "num-traits/std",
  "serde?/std",
]

wasi = [
  "rspace-traits/wasi",
]

wasm = [
  "wasm_bindgen",
  "rspace-traits/wasm",
]
# ************* [FF:Dependencies] *************
alloc = [
  "hashbrown?/alloc",
  "rspace-traits/alloc",
  "serde?/alloc",
]

complex = [
  "dep:num-complex",
  "rspace-traits/complex",
]

hashbrown = [
  "dep:hashbrown",
  "rspace-traits/hashbrown",
]

rayon = [
  "hashbrown?/rayon",
  "rspace-traits/rayon",
]

rand = [
  "num-complex?/rand",
  "rspace-traits/rand",
]

serde = [
  "dep:serde",
  "hashbrown?/serde",
  "rspace-traits/serde",
  "num-complex/serde",
]

wasm_bindgen = ["dep:wasm-bindgen"]
