name: cargo-bench
# This workflow is used to benchmark a Rust project.
# It is automatically run whenever:
# - a pull-request is closed (to capture the final state of the PR),
# - a new tag is pushed (to capture release performance),
# and can also be triggered manually or via repository dispatch.

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  repository_dispatch:
    types: [cargo-bench]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: full
    outputs:
      id: ${{ steps.artifacts.outputs.artifact-id }}
      digest: ${{ steps.artifacts.outputs.artifact-digest }}
      url: ${{ steps.artifacts.outputs.artifact-url }}
    permissions:
      contents: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.ref }}
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Benchmark (${{ matrix.target }})
        run: cargo bench --locked --verbose --workspace --features full --target ${{ matrix.target }} --
      - name: Upload the benchmarks
        id: artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Benchmark Report (${{ github.run_id }})
          if-no-files-found: error
          overwrite: true
          path: target/criterion/
