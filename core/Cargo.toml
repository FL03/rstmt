[package]
build = "build.rs"
description = "the core modules for the rstmt framework"
name = "rstmt-core"

authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = false
features = ["full"]
rustc-args = ["--cfg", "docsrs"]
version = "v{{version}}"

[package.metadata.release]
no-dev-version = true
tag-name = "v{{version}}"

[lib]
bench = false
crate-type = ["cdylib", "rlib", "staticlib"]
doc = true
doctest = true
test = true

[dependencies]
rstmt-traits = { workspace = true }
# custom
contained = { workspace = true }
rspace = { workspace = true }
variants = { workspace = true }
# concurrency & parallelism
rayon-core = { optional = true, workspace = true }
# data structures
hashbrown = { optional = true, workspace = true }
# error-handling
anyhow = { workspace = true }
thiserror = { workspace = true }
# mathematics
num-complex = { optional = true, workspace = true }
num-integer = { workspace = true }
num-traits = { workspace = true }
# randomization
getrandom = { optional = true, workspace = true }
rand = { optional = true, workspace = true }
rand_core = { optional = true, workspace = true }
rand_distr = { optional = true, workspace = true }
# serialization
serde = { features = ["derive"], optional = true, workspace = true }
serde_derive = { optional = true, workspace = true }
serde_json = { optional = true, workspace = true }
# macros & utilities
paste = { workspace = true }
smart-default = { workspace = true }
strum = { features = ["derive"], workspace = true }
# WebAssembly
wasm-bindgen = { optional = true, workspace = true }

[features]
default = ["std"]

full = [
  "default",
  "complex",
  "hashbrown",
  "json",
  "rand",
  "serde",
]

nightly = [
  "hashbrown?/nightly",
  "rstmt-traits/nightly",
]

# ************* [FF:Environments] *************
std = [
  "alloc",
  "anyhow/std",
  "contained/std",
  "hashbrown?/default",
  "num-complex?/std",
  "num-integer/std",
  "num-traits/std",
  "rand?/std",
  "rand_distr?/std",
  "rspace/std",
  "rstmt-traits/std",
  "serde?/std",
  "serde_json?/std",
  "strum/std",
  "variants/std",
]

wasi = [
  "rspace/wasi",
  "rstmt-traits/wasi",
]

wasm = [
  "wasm_bindgen",
  "rspace/wasm",
  "rstmt-traits/wasm",
  "getrandom?/wasm_js",
  "rayon-core?/web_spin_lock",
]
# ************* [FF:Dependencies] *************
alloc = [
  "rstmt-traits/alloc",
  "contained/alloc",
  "hashbrown?/alloc",
  "rand?/alloc",
  "rand_distr?/alloc",
  "rspace/alloc",
  "serde?/alloc", 
  "serde_json?/alloc",
  "variants/alloc",
]

complex = [
  "dep:num-complex",
  "rspace/complex",
]

hashbrown = [
  "dep:hashbrown", 
  "rspace/hashbrown",
  "rstmt-traits/hashbrown"
]

json = [
  "alloc", 
  "serde",
  "serde_json",
  "rspace/json",
]

rand = [
  "rng",
  "dep:rand",
  "dep:rand_core",
  "dep:rand_distr",
  "rstmt-traits/rand",
  "num-complex?/rand",
]

rayon = [
  "dep:rayon-core",
  "hashbrown?/rayon",
  "rstmt-traits/rayon",
]

rng = [
  "dep:getrandom",
  "rand?/small_rng",
  "rand?/thread_rng",
]

serde = [
  "dep:serde",
  "dep:serde_derive",
  "serde?/derive",
  "hashbrown?/serde",
  "num-complex/serde",
  "rspace/serde",
  "rstmt-traits/serde",
  "rand?/serde",
  "rand_core?/serde",
  "rand_distr?/serde",
]

serde_json = ["dep:serde_json"]

wasm_bindgen = [
  "dep:wasm-bindgen",
  "rspace/wasm_bindgen",
  "rstmt-traits/wasm_bindgen",
]