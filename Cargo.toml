[workspace]
default-members = [
    "rstmt",
]

members = [
    "core",
    "neo",
    "rstmt",
]

resolver = "3"

[workspace.dependencies]
rstmt-core = { default-features = false, path = "./core", version = "0.0.3" }

anyhow = "1"
itertools = "0.14"
lazy_static = "1"
num = { default-features = false, version = "0.4" }
paste = "1"
serde = { default-features = false, version = "1" }
serde_json = "1"
smart-default = "0.7"
strum = { default-features = false, features = [ "derive" ], version = "0.26" }
thiserror = { default-features = false, version = "2" }

[workspace.package]
authors = [ "FL03 <jo3mccain@icloud.com> (https://github.com/FL03)" ]
categories = [  ]
description = "This crate focuses on building a music theory library that can be used to generate music theory data structures and algorithms."
edition = "2024"
homepage = "https://github.com/FL03/rstmt/wiki"
keywords = [ "music" ]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/FL03/rstmt.git"
version = "0.0.3"

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = 'unwind'
rpath = false

[profile.release]
codegen-units = 16
debug = false
debug-assertions = false
incremental = false
lto = false
opt-level = 3
overflow-checks = false
panic = 'unwind'
rpath = false
