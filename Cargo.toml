[workspace]
default-members = [
    "rstmt",
]
exclude = [
    ".artifacts/archive/*",
]
members = [
    "core",
    "nrt",
    "rstmt",
]
resolver = "3"

[workspace.package]
authors = [
    "FL03 <jo3mccain@icloud.com> (https://github.com/FL03)",
    "Scattered-Systems <support@scsys.io> (https://github.com/scattered-systems)"
]
categories = [
    "mathematics",
]
description = "A complete framework for computational music theory, analysis, and research, with a focus on hypergraphs and topology."
edition = "2024"
homepage = "https://github.com/FL03/rstmt/wiki"
keywords = [
    "analysis",
    "composition",
    "music-theory",
    "research",
    "topology",
]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/FL03/rstmt.git"
rust-version = "1.85.0"
version = "0.0.3"

[workspace.dependencies]
rstmt = { default-features = false, path = "rstmt", version = "0.0.3" }
rstmt-core = { default-features = false, path = "core", version = "0.0.3" }
rstmt-nrt = { default-features = false, path = "nrt", version = "0.0.3" }

# custom
rshyper = { default-features = false, features = ["hash_graph"], version = "0.0.10" }
scsys = { default-features = false, features = ["derive"], version = "0.2.8" }

# benchmarking
criterion = { version = "0.6" }
# concurrency & parallelism
crossbeam = { default-features = false,version = "0.9" }
rayon = { default-features = false, version = "1" }
# error-handling
anyhow = { default-features = false, version = "1" }
thiserror = { default-features = false, version = "2" }
# numbers
num = { default-features = false, version = "0.4" }
num-traits = { default-features = false, version = "0.2" }
# randomization
getrandom = { default-features = false, version = "0.3" }
rand = { default-features = false, version = "0.9" }
rand_distr = { default-features = false, version = "0.5" }
# data & serialization
serde = { default-features = false, features = ["derive"], version = "1" }
serde_derive = { version = "1" }
serde_json = { version = "1" }
# macros
itertools = { default-features = false, version = "0.14" }
lazy_static = { version = "1" }
paste = { version = "1" }
smart-default = { version = "0.7" }
strum = { default-features = false, features = ["derive"], version = "0.27" }
# logging
tracing = { default-features = false, features = ["attributes"], version = "0.1" }
tracing-subscriber = { default-features = false, features = ["env-filter", "fmt"], version = "0.3" }

# ************* [Profiles] *************
[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = "thin"
opt-level = 2
overflow-checks = true
panic = "abort"
rpath = true

[profile.release]
codegen-units = 16
debug = false
debug-assertions = false
incremental = false
lto = false
opt-level = "z"
overflow-checks = false
panic = "abort"
rpath = false
