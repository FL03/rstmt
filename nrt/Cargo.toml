[package]
build = "build.rs"
description = "this crate focuses on providing support for the neo-riemannian theory of music"
name = "rstmt-nrt"

authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = false
features = ["default"]
rustc-args = ["--cfg", "docsrs"]
version = "v{{version}}"

[package.metadata.release]
no-dev-version = true
tag-name = "v{{version}}"

[lib]
bench = false
crate-type = ["lib"]
doc = true
doctest = true
test = true

[dependencies]
rstmt-core = { workspace = true }
# custom
rshyper = { features = ["hyper_map"], workspace = true }
rspace-traits = { workspace = true }
variants = { workspace = true }
# data structures
hashbrown = { optional = true, workspace = true }
# concurrency & parallelism
rayon = { optional = true, workspace = true }
# error-handling
anyhow = { workspace = true }
thiserror = { workspace = true }
# mathematics
num-complex = { optional = true, workspace = true }
num-traits = { workspace = true }
# randomization
getrandom = { optional = true, workspace = true }
rand = { optional = true, workspace = true }
rand_distr = { optional = true, workspace = true }
# serialization
serde = { optional = true, workspace = true }
serde_derive = { optional = true, workspace = true }
serde_json = { optional = true, workspace = true }
# logging
tracing = { optional = true, workspace = true }
# macros & utilities
itertools = { workspace = true }
paste = { workspace = true }
smart-default = { workspace = true }
strum = { features = ["derive"], workspace = true }
# WebAssembly
wasm-bindgen = { optional = true, workspace = true }

[features]
default = [
  "motion",
  "std",
  "tonnetz",
]

full = [
  "default",
  "complex",
  "motion",
  "json",
  "rand",
  "serde",
  "tracing",
]

# ********* [FF] Flags *********

motion = [
  "alloc",
  "hashbrown",
]

tonnetz = [
  "alloc",
  "hashbrown",
  "rshyper/hyper_map",
]

# ********* [FF] Environments *********

nightly = [
  "hashbrown?/nightly",
  "rshyper/nightly",
  "rstmt-core/nightly",
]

std = [
  "alloc",
  "anyhow/std",
  "hashbrown?/default",
  "itertools/use_std",
  "num-complex?/std",
  "num-traits/std",
  "rand?/std",
  "rand?/std_rng",
  "rand_distr?/std",
  "rspace-traits/std",
  "rshyper/std",
  "rstmt-core/std",
  "serde?/std",
  "serde_json?/std",
  "strum/std",
  "variants/std",
]

wasi = [
  "rspace-traits/wasi",
  "rstmt-core/wasi",
]

wasm = [
  "getrandom?/wasm_js",
  "rayon?/web_spin_lock",
  "rspace-traits/wasm",
  "rstmt-core/wasm",
]

# ********* [FF] Dependencies *********

alloc = [
  "hashbrown?/alloc",
  "itertools/use_alloc",
  "rand?/alloc",
  "rand_distr?/alloc",
  "rshyper/alloc",
  "rspace-traits/alloc",
  "rstmt-core/alloc",
  "serde?/alloc",
  "serde_json?/alloc",
  "variants/alloc",
]

complex = [
  "dep:num-complex",
  "rspace-traits/complex",
  "rstmt-core/complex",
]

json = [
  "alloc",
  "serde",
  "serde_json",
  "rshyper/json",
  "rstmt-core/json",
]

hashbrown = [
  "dep:hashbrown",
  "rspace-traits/hashbrown",
  "rstmt-core/hashbrown",
]

rand = [
  "dep:rand",
  "dep:rand_distr",
  "rng",
  "num-complex?/rand",
  "rshyper/rand",
  "rstmt-core/rand",
]

rayon = [
  "dep:rayon",
  "hashbrown?/rayon",
  "rshyper/rayon",
  "rstmt-core/rayon",
]

rng = [
  "dep:getrandom",
  "rand/small_rng",
  "rand/thread_rng",
  "rshyper/rng",
  "rstmt-core/rng",
]

serde = [
  "dep:serde",
  "dep:serde_derive",
  "serde?/derive",
  "hashbrown?/serde",
  "num-complex?/serde",
  "rand?/serde",
  "rand_distr?/serde",
  "rspace-traits/serde",
  "rshyper/serde",
  "rstmt-core/serde",
]

serde_json = [
  "dep:serde_json",
  "rshyper/serde_json",
  "rstmt-core/serde_json",
]

tracing = [
  "dep:tracing",
  "rstmt-core/tracing",
]

wasm_bindgen = [
  "dep:wasm-bindgen",
  "rshyper/wasm_bindgen",
  "rspace-traits/wasm_bindgen",
  "rstmt-core/wasm_bindgen",
]
